<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NileDrip | My Profile</title>
    <link rel="stylesheet" href="../CSS/style-base.css">
    <link rel="stylesheet" href="../CSS/style-dashboard-admin.css">
    <style>
        .profile-header {
            background: linear-gradient(135deg, var(--primary-color), var(--dark-accent));
            color: white;
            padding: var(--spacing-2xl) 0;
            border-radius: 12px;
            margin-bottom: var(--spacing-xl);
        }
        .profile-info h1 { margin: 0; font-size: 2.5rem; }
        .profile-info p { opacity: 0.8; margin-top: 5px; }
        
        .profile-grid {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: var(--spacing-xl);
        }
        
        @media (max-width: 992px) {
            .profile-grid { grid-template-columns: 1fr; }
        }
        
        .profile-nav {
            background: var(--bg-primary);
            padding: var(--spacing-lg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            height: fit-content;
        }
        
        .profile-nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            text-decoration: none;
            color: var(--text-primary);
            border-radius: 8px;
            transition: all 0.3s;
            margin-bottom: 5px;
        }
        
        .profile-nav-link:hover, .profile-nav-link.active {
            background: rgba(255, 0, 110, 0.1);
            color: var(--primary-color);
        }
        
        .order-card {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-lg);
        }
        
        .order-header {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: var(--spacing-md);
            margin-bottom: var(--spacing-md);
        }
        
        .order-status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .status-shipped { background: #e3f2fd; color: #1976d2; }
        .status-delivered { background: #e8f5e9; color: #2e7d32; }
        
        .order-item {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
        }
        
        .order-item img {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
        }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="container">
        <div class="navbar-brand">
            <a href="../index.html" class="logo">
                NILE<span class="drip">DRIP</span>
            </a>
        </div>
        <div class="navbar-menu" id="navbarMenu">
            <a href="shop.html" class="nav-link">Shop</a>
            <a href="profile.html" class="nav-link active">Profile</a>
        </div>
        <div class="navbar-actions">
            <a href="wishlist.html" class="cart-icon-btn wishlist-icon-btn" aria-label="Wishlist">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                </svg>
            </a>
            <a href="cart.html" class="cart-icon-btn" aria-label="Cart">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
                <span class="cart-nav-badge" id="cartNavBadge" style="display:none">0</span>
            </a>
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="5"></circle>
                </svg>
            </button>
            <button class="hamburger" id="hamburger">
                <span></span><span></span><span></span>
            </button>
        </div>
    </div>
</nav>

    <div class="container" style="margin-top: 100px;">
        <div class="profile-header">
            <div class="container">
                <div class="profile-info">
                    <h1 id="userNameDisplay">Welcome Back</h1>
                    <p id="userEmailDisplay">your.email@example.com</p>
                </div>
            </div>
        </div>

        <div class="profile-grid">
            <aside class="profile-nav">
                <a href="#orders" class="profile-nav-link active">
                    <span>📦</span> My Orders
                </a>
                <a href="wishlist.html" class="profile-nav-link">
                    <span>❤️</span> Wishlist
                </a>
                <a href="#settings" class="profile-nav-link">
                    <span>⚙️</span> Account Settings
                </a>
            </aside>

            <main class="profile-content">
                <div id="ordersSection">
                    <h2>Recent Orders</h2>
                    <div id="ordersList">
                        <!-- Orders will be loaded here -->
                        <div class="order-card">
                            <div class="order-header">
                                <div>
                                    <strong>Order #ND-8492</strong>
                                    <p style="font-size: 14px; color: grey;">Placed on April 20, 2026</p>
                                </div>
                                <span class="order-status status-delivered">Delivered</span>
                            </div>
                            <div class="order-item">
                                <img src="../assets/images/bmw.webp" alt="Product">
                                <div>
                                    <h4>Onyx Black Hoodie</h4>
                                    <p>Size: L | Qty: 1 | 650 EGP</p>
                                </div>
                            </div>
                            <div style="text-align: right; border-top: 1px solid #eee; padding-top: 10px;">
                                <strong>Total: 650 EGP</strong>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../JS/supabase-config.js"></script>
    <script src="../JS/store.js"></script>
    <script src="../JS/db.js"></script>
    <script src="../JS/utils.js"></script>
    <script src="../JS/theme.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = await DB.getCurrentUser();
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            document.getElementById('userNameDisplay').textContent = `Welcome, ${user.user_metadata?.full_name || user.email}`;
            document.getElementById('userEmailDisplay').textContent = user.email;

            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    DB.logout();
                });
            }
        });
    </script>
</body>
</html>
